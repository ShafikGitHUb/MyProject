<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- style css -->
     <link rel="stylesheet" href="style.css">
     <!-- dasi + tawild css -->
 <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<!-- google icon -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
 <!-- icon -->
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <!-- google fonts -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
</head>
</head>
<body class="bg-[#f8fafc]">
<header class="mx-auto">
  <div class="navbar bg-base-100 shadow-sm  flex  justify-between mx-auto">
  <div class="">
    <a class="text-[15px] md:text-xl"><i class="fa-brands fa-github"></i>GitHub Issues Tracker</a>
  </div>
  <div class="flex flex-col md:flex-row gap-2 md:gap-5">
    <input type="search" placeholder="Search" class="input input-bordered w-[85%] md:w-auto" />
    <button class="btn btn-primary text-white mr-8 md:mr-0 p-2 ">+New Issue</button>
  </div>
</div>
</header>
<main>
    <!-- Tabbar section start -->
<section id="btn-section" class="w-[95%] mx-auto bg-white m-4 border-white rounded-md">
<div class="flex justify-start gap-2 p-4">
  <button class="btn btn-primary px-8 rounded-md">All</button>
  <button class="btn btn-outline border-gray-200 text-gray-500 px-8 rounded-md">Open</button>
  <button class="btn btn-outline border-gray-200 text-gray-500 px-8 rounded-md">Closed</button>
</div>
</section>
<!-- issue section start -->
 <section class="flex justify-between bg-white w-[95%] mx-auto p-10">
          <div class="flex items-center gap-3">
            <img src="Images/Aperture.png" alt="">
            <div>    <h2 class="text-xl font-bold text-gray-800">50 Issues</h2>
          <p class="text-gray-500 text-sm">Track and manage your project issues</p></div>
        </div>
        <div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 bg-emerald-500 rounded-full"></span>
          <span class="text-gray-700 font-medium">Open</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 bg-indigo-500 rounded-full"></span>
          <span class="text-gray-700 font-medium">Closed</span>
        </div>
        </div>
 </section>
 
 <!-- loading -->
<div id="loading" class="flex justify-center items-center h-48 hidden">
   <span class="loading loading-spinner text-primary"></span>
</div>
 
 
 <!-- cart section start -->
  <section>
<div id="card-container" class="grid grid-cols-1 md:grid-cols-4 mt-10 w-[95%] mx-auto gap-2">
  
</div>
   </section>


   <!-- modal option -->
<!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
 <button onclick="openModal(1)">Open</button>
<dialog id="my_modal_5" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box">
    <div id="modal-id" class="modal-action">

    </div>
  </div>
</dialog>

</main>
<footer>

</footer>
<script src="js/home.js"></script>
</body>
</html>
